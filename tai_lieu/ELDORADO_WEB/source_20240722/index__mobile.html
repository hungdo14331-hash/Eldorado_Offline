	<script>
		/* Fit-to-screen cho ELDORADO: scale #div_body theo cửa sổ, căn giữa 2 trục.
		   Loader gốc chỉ áp scale trong nhánh có ad-box; offline không có ad-box
		   nên k=NaN → không bao giờ scale → game lệch trái trên. Script này chạy
		   độc lập, kích thước tính lại mỗi resize (chia đôi màn hình). */
		(function () {
			var lastW = -1, lastH = -1;
			function fit() {
				var vw = window.innerWidth || document.documentElement.clientWidth || 1280;
				var vh = window.innerHeight || document.documentElement.clientHeight || 640;
				document.body.style.background = "#000";
				var db = document.getElementById("div_body");
				if (!db) return;
				if (vw === lastW && vh === lastH) { return; }
				lastW = vw; lastH = vh;
				var s = Math.min(vw / 1280, vh / 720);
				var w = 1280 * s, h = 720 * s;
				var L = Math.max(0, Math.round((vw - w) / 2));
				var T = Math.max(0, Math.round((vh - h) / 2));
				$(db).css({
					left: L + "px", top: T + "px",
					width: w + "px", height: h + "px",
					transform: "scale(" + s + ")",
					"-ms-transform": "scale(" + s + ")",
					"-webkit-transform": "scale(" + s + ")",
					"transform-origin": "0 0",
					"-webkit-transform-origin": "0 0"
				});
			}
			function onResize() { clearTimeout(onResize.__t); onResize.__t = setTimeout(fit, 120); }
			window.addEventListener("resize", onResize);
			window.addEventListener("orientationchange", onResize);
			// chờ loader chèn xong #div_body rồi mới fit lần đầu
			var t = setInterval(function () {
				if (document.getElementById("div_body")) { fit(); clearInterval(t); }
			}, 60);
			setTimeout(fit, 800);  // lỡ loader vẽ sau cùng
		})();
	</script>

	<script>
		/* ⚡ 2x SPEED: bọc setInterval/setTimeout trước khi game core spawn.
		   Bật → delay ngắn (<=4000ms) chia đôi, re-arm toàn bộ interval sống.
		   Timer thật (email/guild/refresh/sound) giữ nguyên qua isRealtime. */
		(function () {
			if (window.__ELD_2X__) return;
			window.__ELD_2X__ = true;
			var __oSI = window.setInterval, __oCI = window.clearInterval, __oST = window.setTimeout, __oCT = window.clearTimeout;
			window.__2X_ON__ = false;
			window.__2X_LOG__ = [];
			var __reg = {};
			var __hi = 4000;
			function isRealtime(fn) {
				var s;
				try { s = fn.toString(); } catch (e) { return false; }
				return /email_vaild_time|interval_update_remaintime|refresh_all|sound_bgm/.test(s);
			}
			function off(fn, ms) {
				var rt = isRealtime(fn);
				var fast = !rt && ms > 0 && ms <= __hi;
				return fast ? Math.max(1, Math.round(ms / 2)) : ms;
			}
			function log(what, ms, orig, id, rt) {
				if (window.__2X_LOG__.length > 200) window.__2X_LOG__.shift();
				window.__2X_LOG__.push(what + "|" + orig + "|" + ms + "|" + id + "|" + (rt ? "RT" : "game"));
			}
			function wrapSI(fn, ms) {
				var base = ms;
				var rt = isRealtime(fn);
				var id = __oSI(fn, off(fn, base));
				__reg[id] = { fn: fn, ms: base, live: true, rt: rt };
				if (window.__2X_ON__) log("I", base, ms, id, rt);
				return id;
			}
			function applyAll() {
				for (var id in __reg) {
					var e = __reg[id];
					if (!e.live) continue;
					var want = (window.__2X_ON__ && e.ms > 0 && e.ms <= __hi && !e.rt) ? Math.max(1, Math.round(e.ms / 2)) : e.ms;
					__oCI(id);
					var nid = __oSI(e.fn, want);
					delete __reg[id];
					__reg[nid] = e;
					e.live = true;
				}
			}
			function oCIreal(id) { if (__reg[id]) __reg[id].live = false; return __oCI(id); }
			function wrapST(fn, ms) {
				var rt = isRealtime(fn);
				var base = ms;
				var id = __oST(fn, off(fn, base));
				if (window.__2X_ON__) log("T", base, ms, id, rt);
				return id;
			}
			try {
				Object.defineProperty(window, "setInterval", { configurable: true, enumerable: false, writable: true, value: wrapSI });
				Object.defineProperty(window, "clearInterval", { configurable: true, enumerable: false, writable: true, value: oCIreal });
				Object.defineProperty(window, "setTimeout", { configurable: true, enumerable: false, writable: true, value: wrapST });
			} catch (e) {
				window.setInterval = wrapSI;
				window.clearInterval = oCIreal;
				window.setTimeout = wrapST;
			}
			var b = document.getElementById("btn_2x");
			if (b) {
				function upd() {
					b.textContent = window.__2X_ON__ ? "⚡ 2x BẬT" : "⚡ 2x TẮT";
					b.style.background = window.__2X_ON__ ? "#8a2c9e" : "#3a3a3a";
				}
				b.onclick = function () {
					window.__2X_ON__ = !window.__2X_ON__;
					if (window.__2X_ON__) { applyAll(); console.log("[2X] LOG:", window.__2X_LOG__); }
					upd();
				};
				upd();
			}
		})();
	</script>
	<script>
		// Item gacha: chọn loại (1=Đồng hồ, 2=Kiếm, 3=Khiên, 4=Cánh) + ép grade B/A/S.
		// Core item id = [loại][grade][biến thể]; grade hàng chục 5/6/7 = B/A/S.
		// Không sửa min.js -> override runtime.
		(function () {
			function ensureWrap() {
				var c = window.S_ITEM_GACHA_COMPLETE;
				if (!c || !c.calculate || c.__eldIG) return;
				var orig = c.calculate;
				c.calculate = function () {
					orig.apply(this, arguments);
					var sel = window.__item_gacha_type; // 1..4 hoặc undefined
					var how = (typeof ITEM_GACHA_HOW_MANY === "number") ? ITEM_GACHA_HOW_MANY : 6;
					for (var n = 1; n <= how; n++) {
						var r = ITEM_GACHARESULT && ITEM_GACHARESULT[n];
						if (!r || !r.item_num) continue;
						var t = r.item_num;
						var type = Math.floor(t / 100);      // 1..4
						var v = t % 10;                       // 1..3
						if (sel) type = sel;
						var grade = 5 + Math.floor(Math.random() * 3); // 5,6,7 = B,A,S
						r.item_num = type * 100 + grade * 10 + v;
					}
				};
				c.__eldIG = true;
				console.log("[ITEM_GACHA] calculate wrapped");
			}
			ensureWrap();
			setInterval(ensureWrap, 500);

			// Panel 4 nút chọn loại, hiện khi mở màn gacha item.
			var names = ["1 ĐỒNG HỒ", "2 KIẾM", "3 KHIÊN", "4 CÁNH"];
			var colors = ["#4169e1", "#c0392b", "#1e8449", "#a04000"];
			var panel = document.createElement("div");
			panel.id = "item_gacha_type_panel";
			panel.style.cssText = "position:fixed;left:10px;top:180px;z-index:999999;display:none;" +
				"flex-direction:column;gap:6px;background:rgba(0,0,0,.55);padding:8px;border-radius:10px;font-family:Arial,Helvetica,sans-serif;";
			var status = document.createElement("div");
			status.id = "item_gacha_ep_status";
			status.style.cssText = "font:bold 12px Arial;color:#fff;text-align:center;padding:3px;border-radius:6px;background:#333;";
			status.textContent = "EP GRADE: ...";
			panel.appendChild(status);
			names.forEach(function (nm, i) {
				var b = document.createElement("button");
				b.type = "button";
				b.textContent = nm;
				b.dataset.type = i + 1;
				b.style.cssText = "padding:6px 12px;border:none;border-radius:8px;cursor:pointer;" +
					"font-size:13px;font-weight:700;color:#fff;background:" + colors[i] + ";box-shadow:0 2px 6px rgba(0,0,0,.5);";
				b.addEventListener("click", function () {
					window.__item_gacha_type = Number(this.dataset.type);
					var all = panel.querySelectorAll("button");
					for (var j = 0; j < all.length; j++) all[j].style.outline = (all[j] === this) ? "3px solid #fff" : "none";
					console.log("[ITEM_GACHA] type=" + this.textContent);
				});
				panel.appendChild(b);
			});
			document.body.appendChild(panel);

			setInterval(function () {
				var d = document.getElementById("S_ITEM_GACHA_div");
				var d2 = document.getElementById("S_GACHA_div");
				var show = window.S_ITEM_GACHA !== undefined &&
					((d && d.style.display !== "none") ||
					 (d2 && d2.style.display !== "none" && window.S_GACHA && S_GACHA.item_gacha_mode));
				panel.style.display = show ? "flex" : "none";
				var c = window.S_ITEM_GACHA_COMPLETE;
				var wrapped = !!(c && c.__eldIG);
				status.textContent = wrapped ? "EP GRADE: BẬT (B/A/S)" : "EP GRADE: TẮT";
				status.style.background = wrapped ? "#1e8449" : "#b00020";
			}, 200);
		})();
	</script>

		// Autoplay giá 1000 BP (core AUDOPLAY.need_bp=10 cố định trong min.js,
