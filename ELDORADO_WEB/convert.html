<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToolShop · Offline Exchange</title>
<style>
  :root { --bg:#10161f; --panel:#1a2332; --line:#2c3a52; --accent:#5b8def; --ok:#3fbf6f; --err:#e0605f; --txt:#dbe4f0; --dim:#7d8ca3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font:14px/1.5 "Segoe UI", system-ui, sans-serif; padding:24px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:var(--dim); margin-bottom:20px; }
  .balances { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:24px; }
  .bal { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .bal .k { color:var(--dim); font-size:12px; }
  .bal .v { font-size:18px; font-weight:600; margin-top:2px; }
  .row { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px;
         display:grid; grid-template-columns:1fr auto auto auto; gap:12px; align-items:center; }
  .row .lab { font-weight:600; }
  .row .rate { color:var(--dim); font-size:12px; }
  input[type=number] { background:#0d1420; border:1px solid var(--line); color:var(--txt); border-radius:8px;
                       padding:8px 10px; width:130px; font-size:14px; }
  .cost { min-width:150px; color:var(--dim); text-align:right; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 16px; font-size:14px;
           cursor:pointer; font-weight:600; }
  button:hover { filter:brightness(1.1); }
  button:disabled { opacity:.45; cursor:default; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); padding:10px 18px; border-radius:8px;
           color:#fff; font-weight:600; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.ok { background:var(--ok); } #toast.err { background:var(--err); }
</style>
</head>
<body>
  <h1>ToolShop — quy đổi tài nguyên offline</h1>
  <div class="sub">Chỉ hỗ trợ 6 chiều đổi: Vàng → BP/Ruby, Ruby → BP/Vàng/Cloud Piece/Essence. Nhập số lượng nguồn bỏ ra, số dư cập nhật ngay vào save.</div>

  <div class="balances" id="bals"></div>

  <div id="rows"></div>

  <div id="toast"></div>

<script>
const NAMES = { GOLD:"Vàng", RUBY:"Ruby", BP:"BP", CLOUD:"Cloud Piece", ESSENCE:"Essence" };
let bal = {}, RATES = [];

const fmt = n => Number(n||0).toLocaleString("en-US");
const $ = id => document.getElementById(id);

function renderBals() {
  $("bals").innerHTML = Object.entries(bal).map(([k,v]) =>
    `<div class="bal"><div class="k">${NAMES[k]||k}</div><div class="v">${fmt(v)}</div></div>`).join("");
}
function renderRows() {
  $("rows").innerHTML = RATES.map((r,i) => `
    <div class="row">
      <div><div class="lab">${r.label}</div><div class="rate">${r.rate}</div></div>
      <input type="number" min="1" step="1" value="100000" id="inp${i}" oninput="updateCost(${i})">
      <div class="cost" id="cost${i}"></div>
      <button id="btn${i}" onclick="doConvert(${i})">Đổi</button>
    </div>`).join("");
  RATES.forEach((_,i) => updateCost(i));
}
async function loadAll() {
  const res = await api("toolshop/get_balances.php", { FROM:"", TO:"", COUNT:"" });
  bal = { GOLD:res.gold, RUBY:res.ruby, BP:res.bp, CLOUD:res.cloud, ESSENCE:res.essence };
  RATES = (res.rates || []).map(r => ({
    from:r.from, to:r.to, cost:+r.cost, gain:+r.gain,
    label: NAMES[r.from] + " → " + NAMES[r.to],
    rate: fmt(r.cost) + " " + NAMES[r.from] + " = " + fmt(r.gain) + " " + NAMES[r.to],
  }));
  renderBals();
  renderRows();
}
function updateCost(i) {
  const r = RATES[i], n = Math.max(0, Math.floor(Number($(`inp${i}`).value || 0)));
  const gain = Math.floor(n * r.gain / r.cost);
  $(`cost${i}`).textContent = "Bỏ " + fmt(n) + " " + NAMES[r.from] + " → nhận ~" + fmt(gain) + " " + NAMES[r.to];
}
async function api(path, data) {
  const body = new URLSearchParams();
  for (const k of Object.keys(data)) body.append(k, data[k]);
  const res = await fetch(path, { method:"POST", body:body.toString() });
  return res.json();
}
function toast(msg, ok) {
  const t = $("toast");
  t.className = ok ? "ok" : "err";
  t.textContent = msg;
  t.style.opacity = 1;
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.style.opacity = 0, 2500);
}
async function doConvert(i) {
  const r = RATES[i], n = Math.floor(Number($(`inp${i}`).value || 0));
  if (n <= 0) { toast("Nhập số lượng hợp lệ", false); return; }
  const b = $(`btn${i}`); b.disabled = true;
  try {
    const res = await api("toolshop/convert.php", { FROM:r.from, TO:r.to, COUNT:String(n) });
    if (res.STATE === "SUCCESS") {
      bal = { GOLD:res.gold, RUBY:res.ruby, BP:res.bp, CLOUD:res.cloud, ESSENCE:res.essence };
      renderBals();
      toast(`Đổi thành công: + ${fmt(res.gained)} ${NAMES[r.to]} (mất ${fmt(res.spent)} ${NAMES[r.from]})`, true);
    } else {
      toast("Lỗi: " + (res.msg === "not enough" ? "không đủ tài nguyên" : res.msg === "unknown pair" ? "cặp không hợp lệ" : res.msg === "too small" ? "số lượng quá nhỏ" : "đã xảy ra lỗi"), false);
    }
  } catch (e) {
    toast("Không kết nối được server", false);
  } finally {
    b.disabled = false;
  }
}
(async function init() {
  try {
    await loadAll();
  } catch (e) {
    toast("Không đọc được số dư — server còn chạy không?", false);
  }
})();
</script>
</body>
</html>
